<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Post 10 — LexikoVerse</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000}
.video-container{position:relative;width:100%;max-width:608px;height:100vh;max-height:1080px;margin:0 auto;overflow:hidden;background:#000}
.text-layer{position:absolute;top:0;left:0;width:100%;height:100%;z-index:2;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:2rem;text-align:center}
.text-line{font-family:'Poppins',sans-serif;font-weight:500;font-size:clamp(1.15rem,4.2vw,1.5rem);color:#fff;opacity:0;position:absolute;top:46%;left:50%;transform:translate(-50%,-50%);width:82%;max-width:460px;line-height:1.6;letter-spacing:.04em}
.text-line.typewriter::after{content:'|';display:inline-block;color:rgba(255,255,255,0.7);font-weight:300;margin-left:2px}
.text-line.typewriter.blinkoff::after{opacity:0}
.text-line.typewriter.done::after{display:none}
.logo-area{position:absolute;top:45%;left:50%;transform:translate(-50%,-50%);z-index:3;opacity:0;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:1.5rem}
.logo-area.show{animation:logoSlideUp .8s ease-out forwards}
@keyframes logoSlideUp{0%{opacity:0;transform:translate(-50%,calc(-50% + 60px))}100%{opacity:1;transform:translate(-50%,-50%)}}
.logo-area img{width:70vw;max-width:450px;height:auto}
.bottom-info{position:absolute;bottom:8rem;left:0;width:100%;text-align:center;z-index:4;opacity:0}
.bottom-tagline{font-family:'Poppins',sans-serif;font-weight:300;font-size:clamp(1.5rem,3.2vw,1.2rem);color:#fff;letter-spacing:.15em;margin-bottom:3rem}
.bottom-url{font-family:'Poppins',sans-serif;font-weight:300;font-size:clamp(.7rem,2vw,.85rem);color:rgba(255,255,255,0.4);letter-spacing:.25em}
.progress-bar{position:absolute;bottom:3%;left:0;height:2px;z-index:10;background:rgba(255,255,255,0.15);width:0;border-radius:0 2px 2px 0}
@media(max-width:420px){.text-line{font-size:.95rem;width:78%}.bottom-info{bottom:1.8rem}.text-layer{padding:1.2rem}}
</style>
</head>
<body>
<div class="video-container" id="app">
<div class="text-layer">
<div class="text-line typewriter" id="line1">Get exclusive access.</div>
</div>
<div class="logo-area" id="logoArea"><img src="../../../assets/logo.png" alt="LexikoVerse"></div>
<div class="bottom-info" id="bottomInfo">
<div class="bottom-tagline">Read. Create. Belong.</div>
<div class="bottom-url">2026 · lexikoverse.com</div>
</div>
<div class="progress-bar" id="progressBar"></div>
</div>
<script>
(function(){
'use strict';
const SPEED=35,VARIANCE=10,TEXT1='Get exclusive access.';
const line1=document.getElementById('line1'),logoArea=document.getElementById('logoArea'),bottomInfo=document.getElementById('bottomInfo'),progressBar=document.getElementById('progressBar');
let blinkTimer=null;
function stopBlink(el){if(blinkTimer){clearTimeout(blinkTimer);blinkTimer=null}if(el)el.classList.remove('blinkoff')}
function startBlink(el){stopBlink(el);const step=()=>{el.classList.toggle('blinkoff');blinkTimer=setTimeout(step,350)};blinkTimer=setTimeout(step,350)}
function typeText(el,text,startDelay,onDone){el.textContent='';el.style.opacity='1';startBlink(el);let i=0;const type=()=>{if(i<text.length){el.textContent+=text.charAt(i);i++;setTimeout(type,SPEED+(Math.random()-.5)*2*VARIANCE)}else{stopBlink(el);el.classList.add('done');if(onDone)setTimeout(onDone,0)}};setTimeout(type,startDelay*1e3)}
function fadeOut(el,duration,cb){el.style.transition=`opacity ${duration}s ease-out`;el.style.opacity='0';if(cb)setTimeout(cb,duration*1e3)}
function fadeIn(el,duration,delay){setTimeout(()=>{el.style.transition=`opacity ${duration}s ease-out`;el.style.opacity='1'},delay*1e3)}
function startTimeline(){typeText(line1,TEXT1,.3,()=>{setTimeout(()=>{fadeOut(line1,.5,()=>{logoArea.classList.add('show');logoArea.style.opacity='1';fadeIn(bottomInfo,.6,.25)})},1800)})}
function animateProgress(){const start=performance.now(),duration=6700;function tick(now){const pct=Math.min(1,(now-start)/duration);progressBar.style.width=(pct*100)+'%';if(pct<1)requestAnimationFrame(tick)}requestAnimationFrame(tick)}
let started=false;
document.addEventListener('click',function(){if(started)return;started=true;startTimeline();animateProgress()});
window.__SCENE_DURATION_MS=6700;
})();
</script>
</body>
</html>
