<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Post 8 — LexikoVerse</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000}
.video-container{position:relative;width:100%;max-width:608px;height:100vh;max-height:1080px;margin:0 auto;overflow:hidden;background:#000}
.text-layer{position:absolute;top:0;left:0;width:100%;height:100%;z-index:2;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:2rem;text-align:center;gap:.8rem}
.text-line{font-family:'Poppins',sans-serif;font-weight:300;font-size:clamp(1.15rem,4.2vw,1.5rem);color:#fff;opacity:0;width:82%;max-width:460px;line-height:1.6;letter-spacing:.03em;transform:translateY(10px)}
.text-line.in{animation:debugFadeUp .6s ease-out forwards}
.logo-area{position:absolute;top:45%;left:50%;transform:translate(-50%,-50%);z-index:3;opacity:0;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:1.5rem}
.logo-area.show{animation:logoGlowPulse 1s ease-out forwards}
@keyframes logoGlowPulse{0%{opacity:0;filter:brightness(3) blur(2px)}60%{opacity:1;filter:brightness(1.3)}100%{opacity:1;filter:brightness(1)}}
@keyframes debugFadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.logo-area img{width:70vw;max-width:450px;height:auto}
.bottom-info{position:absolute;bottom:8rem;left:0;width:100%;text-align:center;z-index:4;opacity:0}
.bottom-tagline{font-family:'Poppins',sans-serif;font-weight:300;font-size:clamp(1.5rem,3.2vw,1.2rem);color:#fff;letter-spacing:.15em;margin-bottom:3rem}
.bottom-url{font-family:'Poppins',sans-serif;font-weight:300;font-size:clamp(.7rem,2vw,.85rem);color:rgba(255,255,255,0.4);letter-spacing:.25em}
.progress-bar{position:absolute;bottom:3%;left:0;height:2px;z-index:10;background:rgba(255,255,255,0.15);width:0;border-radius:0 2px 2px 0}
@media(max-width:420px){.text-line{font-size:.85rem;width:82%}.bottom-info{bottom:1.8rem}.text-layer{padding:1.2rem}}
</style>
</head>
<body>
<div class="video-container" id="app">
<div class="text-layer">
<div class="text-line" id="line1">It won't be a library.</div>
<div class="text-line" id="line2">Nor a social network.</div>
<div class="text-line" id="line3">It will be something different.</div>
</div>
<div class="logo-area" id="logoArea"><img src="../../../assets/logo.png" alt="LexikoVerse"></div>
<div class="bottom-info" id="bottomInfo">
<div class="bottom-tagline">Read. Create. Belong.</div>
<div class="bottom-url">2026 · lexikoverse.com</div>
</div>
<div class="progress-bar" id="progressBar"></div>
</div>
<script>
(function(){
'use strict';
const lines=[document.getElementById('line1'),document.getElementById('line2'),document.getElementById('line3')];
const logoArea=document.getElementById('logoArea'),bottomInfo=document.getElementById('bottomInfo'),progressBar=document.getElementById('progressBar');
function fadeIn(el,duration,delay){setTimeout(()=>{el.style.transition=`opacity ${duration}s ease-out`;el.style.opacity='1'},delay*1e3)}
function cascadeLines(index){if(index>=lines.length)return;lines[index].classList.add('in');setTimeout(()=>cascadeLines(index+1),900)}
function startTimeline(){setTimeout(()=>cascadeLines(0),400);const totalCascade=400+lines.length*900+2000;setTimeout(()=>{lines.forEach(l=>{l.style.transition='opacity .5s ease-out';l.style.opacity='0'});setTimeout(()=>{logoArea.classList.add('show');logoArea.style.opacity='1';fadeIn(bottomInfo,.6,.3)},500)},totalCascade)}
function animateProgress(){const start=performance.now(),duration=7800;function tick(now){const pct=Math.min(1,(now-start)/duration);progressBar.style.width=(pct*100)+'%';if(pct<1)requestAnimationFrame(tick)}requestAnimationFrame(tick)}
let started=false;
document.addEventListener('click',function(){if(started)return;started=true;startTimeline();animateProgress()});
window.__SCENE_DURATION_MS=7800;
})();
</script>
</body>
</html>
